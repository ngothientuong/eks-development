AWS IAM ASSUMED ROLE - HOW IT WORKS
IAM user or SA or Node with certain AWS arn AAA tries to use a policies PPP attached to a certain role RRR, that role RRR will has to have trust policy
with principal containing the arn AAA and  "Action": "sts:AssumeRole",  "Effect": "Allow", "Resource": "*"

With that, IAM user or SA or Node will not need to have policies PPP attached directly to them directly but they can assume the role RRR to use the policies PPP.

IAM ASSUMED ROLE VS IAM PASS ROLE
AssumeRole is an API action that allows a principal to get temporary credentials that allows them to then make API calls as the assumed role.

PassRole is not an API call itself, but rather a permission required for a principal to pass (attach) a role  to another AWS service. 
Pass Role example:
Example 1: If you want to launch a CloudFormation stack that requires permissions you don’t have directly, 
you can tell CloudFormation to use a different role in order to get the necessary permissions. 
But in order to do that the principal launching the stack needs to have permission to PassRole (attach role) for the role in question. 
This way you can have a relatively unprivileged role that doesn’t have the ability to escalate privileges directly, 
but can invoke other services to go do more privileged actions on its behalf.
Example 2: 
A user/node/sa (principle) can assume the role RRR with the following policy PPP attached to the role RRR:
====== Policy PPP =========
{
   "Version": "2012-10-17",
   "Statement": [{
    "Effect":"Allow",
    "Action":["ec2:*"],
    "Resource":"*"
    },
    {
    "Effect":"Allow",
    "Action":"iam:PassRole",
    "Resource":"arn:aws:iam::Account_ID:role/S3Access"
    }]
}
======End of Policy PPP =====
Policy PPP says that the user/node/sa (principle) can do everything with ec2 instance, including creation of ec2 instance.
The iam:PassRole also says that, however, the user can only pass role or attach role S3Access to the resource, i.e. ec2 instances created. 
That means the user can't attach administrator policy to the instance!
	



