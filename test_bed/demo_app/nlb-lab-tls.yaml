kind: Certificate
apiVersion: cert-manager.io/v1
metadata:
  name: nlb-lab-tls-cert
  namespace: test
spec:
  commonName: "*elb.us-east-2.amazonaws.com"
  dnsNames:
    - "*elb.us-east-2.amazonaws.com"
    - tuong-ngo.test.eks.bylightsdc.bylight.com
  duration: 2160h0m0s
  issuerRef:
    group: awspca.cert-manager.io
    kind: AWSPCAClusterIssuer
    name: demo-test-root-ca
  renewBefore: 360h0m0s
  secretName: nlb-tls-app-secret
  usages:
    - server auth
    - client auth
  privateKey:
    algorithm: "RSA"
    size: 2048
