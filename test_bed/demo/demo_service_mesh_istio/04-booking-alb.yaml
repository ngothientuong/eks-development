---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
    alb.ingress.kubernetes.io/healthcheck-protocol: 'HTTP'
    alb.ingress.kubernetes.io/success-codes: '200'    
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/backend-protocol: HTTPS
    alb.ingress.kubernetes.io/load-balancer-name: tngo-eks-booking-mgmt-eu-alb
    #alb.ingress.kubernetes.io/ip-address-type: ipv4
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/subnets: 'subnet-0698f5156de80d6ae,subnet-056c275475bd56e47'   # Required to be in public subnets for internet facing!!  
    alb.ingress.kubernetes.io/actions.ssl-redirect: '443'
    # ALB will automatically pull the cert from ACM unless we want to specify certain one      
    # alb.ingress.kubernetes.io/certificate-arn: |
    #   arn:aws:acm:xxxxxx:999999999999:certificate/xxxxxxxxx

    cert-manager.io/cluster-issuer: tngo-eks-ca

    # External DNS
    # Just need 1 DNS. The spec.rules.host or spec.tls.hosts section will write hosts to Route53
    external-dns.alpha.kubernetes.io/hostname: tngo-eks-booking-eu.bylightsdc.bylight.com    


  name: booking-gw-ingress-alb
  namespace: istio-system
spec:
  # #ingressClassName: alb
  tls: # < placing a host in the TLS config will determine what ends up in the cert's subjectAltNames  
  - hosts:
    ### Must match with the spec.dnsNames in the existing certificate creation
    - tngo-eks-booking-eu.bylightsdc.bylight.com
    secretName: tngo-eks-alb-booking-gw-tls      # < cert-manager will store the created certificate in this secret.  
  rules:
    - host: "tngo-eks-booking-eu.bylightsdc.bylight.com"
      # http: &backend
      http: 
        paths:
         - path: /healthz/ready
           pathType: Prefix
           backend:
             service:
               name: istio-gateway
               port:
                 number: 15021
         - path: /
           pathType: Prefix
           backend:
             service:
               name: istio-gateway
               port:
                 number: 443       
  #  - host: "tngo-eks-grafana-mgmt-eu.bylightsdc.bylight.com"
  #    http: *backend            
