apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    external-dns.alpha.kubernetes.io/hostname: eks-tim-echo.bylightsdc.bylight.com
    #external-dns.alpha.kubernetes.io/alias: eks-tim-echo.bylightsdc.bylight.com
    kubernetes.io/ingress.class: alb
  name: echoserver
  namespace: echoserver
spec:
  #ingressClassName: alb
  rules:
  - host: eks-tim-echo.bylightsdc.bylight.com
    http:
      paths:
      - path: /
        backend:
          service:
            name: echoserver
            port:
              number: 80
        pathType: Prefix