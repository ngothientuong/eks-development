---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd    
  annotations:    
    #service.beta.kubernetes.io/aws-load-balancer-type: "nlb-ip"
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    #service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-name: tngo-eks-external-dns-test    
    service.beta.kubernetes.io/aws-load-balancer-subnets: ["subnet-0f08d68d1c661395a","subnet-0312fb0e0e36c8b49"]   # Required to be in public subnets for internet facing!!
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/"  # for HTTP(S) protocols
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: 80   # for HTTP(S) protocols
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    # Cert Manager
    cert-manager.io/issuer: tngo-eks-ca
    cert-manager.io/cluster-issuer: tngo-eks-ca
    cert-manager.io/issuer-kind: AWSPCAClusterIssuer
    cert-manager.io/issuer-group: awspca.cert-manager.io
    # External DNS
    external-dns.alpha.kubernetes.io/hostname: tngo-eks-argocd.bylightsdc.bylight.com
  name: argocd-server    
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  - name: https
    port: 443
    protocol: TCP
    targetPort: 8080
  selector:
    app.kubernetes.io/name: argocd-server
