# Cluster unique name and ID
cluster:
  name: project-mgmt-eks-cluster-rancher-test
  id: 254

operator:
  # -- Enable the cilium-operator component (required).
  enabled: true
  # -- Roll out cilium-operator pods automatically when configmap is updated.
  rollOutPods: true
  # -- Number of replicas to run for the cilium-operator deployment
  replicas: 1

ipam:
  # -- Configure IP Address Management mode.
  # ref: https://docs.cilium.io/en/stable/network/concepts/ipam/
  mode: "cluster-pool"
  operator:
    # -- Deprecated in favor of ipam.operator.clusterPoolIPv4PodCIDRList.
    # IPv4 CIDR range to delegate to individual nodes for IPAM.
    clusterPoolIPv4PodCIDR: ""   #  <<< Must be Unique for each cluster!!!!
    # -- IPv4 CIDR list range to delegate to individual nodes for IPAM.
    clusterPoolIPv4PodCIDRList: ["10.192.0.0/15","10.194.0.0/15"]
    clusterPoolIPv4MaskSize: "15"  # Must match with /number above

# -- Configure the eBPF-based ip-masq-agent
ipMasqAgent:
  enabled: false

bpf: 
  masquerade: false

# Remove taint key ignore-taint.cluster-autoscaler.kubernetes.io/agent-not-ready
# and key ignore-taint.cluster-autoscaler.kubernetes.io/cilium-agent-not-ready 
# from node to allow cluster-autoscaler to scale and only remove taint 
# after cilium agent (ds cilium) is ready
# --kube-proxy-replacement string                           Enable only selected features (will panic if any selected feature cannot be enabled) ("partial"), or enable all features (will panic if any feature cannot be enabled) ("strict"), or completely disable it (ignores any selected feature) ("disabled") (default "partial")
#extraArgs: ['--agent-not-ready-taint-key=ignore-taint.cluster-autoscaler.kubernetes.io/agent-not-ready','--debug']
extraArgs: ['--agent-not-ready-taint-key=ignore-taint.cluster-autoscaler.kubernetes.io/cilium-agent-not-ready']
egressMasqueradeInterfaces: eth0

# Configure common TLS
# -- Configure TLS configuration in the agent.
tls:
  # -- This configures how the Cilium agent loads the secrets used TLS-aware CiliumNetworkPolicies
  # (namely the secrets referenced by terminatingTLS and originatingTLS).
  # Possible values:
  #   - local
  #   - k8s
  secretsBackend: local

  # -- Base64 encoded PEM values for the CA certificate and private key.
  # This can be used as common CA to generate certificates used by hubble and clustermesh components
  ca:
    # -- Optional CA cert. If it is provided, it will be used by cilium to
    # generate all other certificates. Otherwise, an ephemeral CA is generated.
    cert: ""

    # -- Optional CA private key. If it is provided, it will be used by cilium to
    # generate all other certificates. Otherwise, an ephemeral CA is generated.
    key: ""

    # -- Generated certificates validity duration in days. This will be used for auto generated CA.
    certValidityDuration: 10950

# Enable Hubble relay  
hubble:
  relay:
    # -- Enable Hubble Relay (requires hubble.enabled=true)
    enabled: true
    # -- Roll out Hubble Relay pods automatically when configmap is updated.
    rollOutPods: true
  ui:
    # -- Whether to enable the Hubble UI.
    enabled: true    

serviceAccounts:
  relay:
    create: true
    name: hubble-relay
    automount: true
    annotations: {}

# #Preflight enable breaks cilium
# preflight:
#   -- Enable Cilium pre-flight resources (required for upgrade)
#   enabled: false
## Do NOT enable debug for now, it breaks Cilium Controller
debug:
  # -- Enable debug logging
  enabled: true
  verbose: 4

# -- Roll out cilium agent pods automatically when configmap is updated.
rollOutCiliumPods: true

etcd:
  # -- Enable etcd mode for the agent.
  enabled: false

ingressController:
  # -- Enable cilium ingress controller
  # This will automatically set enable-envoy-config as well.
  enabled: false

  # -- Default ingress load balancer mode
  # Supported values: shared, dedicated
  # For granular control, use the following annotations on the ingress resource
  # ingress.cilium.io/loadbalancer-mode: shared|dedicated,
  loadbalancerMode: dedicated

  # -- Enforce https for host having matching TLS host in Ingress.
  # Incoming traffic to http listener will return 308 http error code with respective location in header.
  enforceHttps: true

  # -- IngressLBAnnotations are the annotation prefixes, which are used to filter annotations to propagate
  # from Ingress to the Load Balancer service
  ingressLBAnnotationPrefixes: ['service.beta.kubernetes.io', 'service.kubernetes.io', 'cloud.google.com']

  # -- SecretsNamespace is the namespace in which envoy SDS will retrieve TLS secrets from.
  secretsNamespace:
    # -- Create secrets namespace for Ingress.
    create: true

    # -- Name of Ingress secret namespace.
    name: cilium-secrets

    # -- Enable secret sync, which will make sure all TLS secrets used by Ingress are synced to secretsNamespace.name.
    # If disabled, TLS secrets must be maintained externally.
    sync: true

# # # ## Enable GatewayAPI - Cannot Enable as it'll break controller
# # gatewayAPI:
# #   # -- Enable support for Gateway API in cilium
# #   # This will automatically set enable-envoy-config as well.
# #   enabled: false
kubeProxyReplacement: partial # Required for Ingress/Gateway API. Partial just in case
# # kubeConfigPath: "~/.kube/project-mgmt-eks-cluster-rancher-test.config"
# # k8sServiceHost: EE00B7C37FBEFD736D4DCB89D9BF09D7.sk1.us-east-2.eks.amazonaws.com
# # k8sServicePort: 443

l7Proxy: false    ## Set to false to enable encryption type wireguard
tunnel: "vxlan"
#ipv4NativeRoutingCIDR: "10.0.0.0/9"
encryption:
  # -- Enable transparent network encryption.
  enabled: true
  type: wireguard    ## Type wireguard does not support Ingress L7 Proxy
  # type: ipsec    ## Type wireguard does not support Ingress L7 Proxy
  # ipsec:
  #   # -- Name of the key file inside the Kubernetes secret configured via secretName.
  #   keyFile: "keys"

  #   # -- Path to mount the secret inside the Cilium pod.
  #   mountPath: "/etc/ipsec"

  #   # -- Name of the Kubernetes secret containing the encryption keys.
  #   secretName: "cilium-ipsec-keys"

  #   # -- The interface to use for encrypted traffic.
  #   interface: "eth0"    

# # -- cilium-monitor sidecar.
# monitor:
#   # -- Enable the cilium-monitor sidecar.
#   enabled: true

