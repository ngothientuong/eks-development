configuration:
  backupStorageLocation:
    bucket: ${bucket}
    prefix: "eks_backup/${cluster_name}/cluster/"
    config:
      region: ${region}
  provider: velero.io/aws
  volumeSnapshotLocation:  
    config:
      region: ${region}
# These are server-level settings passed as CLI flags to the `velero server` command. Velero
  # uses default values if they're not passed in, so they only need to be explicitly specified
  # here if using a non-default value. The `velero server` default values are shown in the
  # comments below.
  # --------------------
  # `velero server` default: 1m
  backupSyncPeriod:
  # `velero server` default: 1h
  resticTimeout:
  # `velero server` default: namespaces,persistentvolumes,persistentvolumeclaims,secrets,configmaps,serviceaccounts,limitranges,pods
  restoreResourcePriorities:
  # `velero server` default: false
  restoreOnlyMode:
  extraEnvVars:
    AWS_CLUSTER_NAME: ${cluster_name}
  # Set log-level for Velero pod. Default: info. Other options: debug, warning, error, fatal, panic.
  logLevel: debug
##
## End of backup/snapshot location settings.
##
##
## Settings for additional Velero resources.
##
rbac:
  create: true
  clusterAdministrator: true
backupsEnabled: true
snapshotsEnabled: true
deployNodeAgent: false  

credentials:
  useSecret: true
  secretContents:
    cloud: |
      [default]
      aws_access_key_id=${aws_access_key_id}
      aws_secret_access_key=${aws_secret_access_key}    
initContainers:
- name: velero-plugin-for-aws
  image: velero/velero-plugin-for-aws:v1.6.1
  volumeMounts:
  - mountPath: /target
    name: plugins
