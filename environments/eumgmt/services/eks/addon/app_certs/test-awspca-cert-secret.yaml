# Run this twice because you don't know 
# the server name, aka. your LB DNS until you ran it the first time
# to fill in the configmap section: server_name ${lb_address};
apiVersion: awspca.cert-manager.io/v1beta1
kind: AWSPCAClusterIssuer
metadata:
  name: tngo-eks-ca
spec:
  arn: arn:aws:acm-pca:us-east-2:682331604648:certificate-authority/d6d38646-9c02-488b-94ab-c5894de95b95
  region: us-east-2
---
---    
kind: Certificate
apiVersion: cert-manager.io/v1
metadata:
  name: tngo-apps-eks-cert-2
spec:
  commonName: "*.bylightsdc.bylight.com"
  dnsNames:
    - '*.bylightsdc.bylight.com'
    - tngo-eks-istiod-gateway-rancher-test.bylightsdc.bylight.com
    - tngo-eks-istiod-gateway-int-test.bylightsdc.bylight.com
    - tngo-eks-istiod-gateway-int-2.bylightsdc.bylight.com
    - tngo-eks-istiod-gateway-eu-west-2.bylightsdc.bylight.com
    - tngo-eks-*.bylightsdc.bylight.com
    - tngo-eks-argocd.bylightsdc.bylight.com
    - tngo-eks-istio.bylightsdc.bylight.com
    - tngo-eks-cilium.bylightsdc.bylight.com
    - tngo-eks-apps.bylightsdc.bylight.com
    - tngo-eks-hbbl-eu-west-2.bylightsdc.bylight.com
    - tngo-eks-hbbl-rancher-test.bylightsdc.bylight.com
    - tngo-eks-hbbl-int-test.bylightsdc.bylight.com
    - tngo-eks-hbbl-int-2.bylightsdc.bylight.com

  duration: 7200h0m0s
  issuerRef:
    group: awspca.cert-manager.io
    kind: AWSPCAClusterIssuer
    name: tngo-eks-ca
  renewBefore: 360h0m0s
  secretName: tngo-apps-eks-cert
  usages:
    - server auth
    - client auth
  privateKey:
    algorithm: "RSA"
    size: 2048
